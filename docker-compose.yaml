services:
  cyberstrike:
    build:
      context: .
      args:
        GOPROXY: https://goproxy.cn,direct
        GOSUMDB: sum.golang.google.cn
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: cyberstrike-ai:local
    container_name: cyberstrike-ai
    restart: unless-stopped
    ports:
      # Web 管理面（明文 HTTP，容器内用 --http 覆盖示例配置里的自签 HTTPS）
      - "8080:8080"
      # HTTP MCP：POST /mcp，请求头 X-MCP-Token
      - "8081:8081"
    environment:
      # 首次初始化内置 admin 时使用。至少 8 位。留空则随机生成并只在日志里打印一次。
      # 数据库里已有 admin 密码时不会覆盖。
      CYBERSTRIKE_ADMIN_PASSWORD: ${CYBERSTRIKE_ADMIN_PASSWORD:-}
      # 首次生成 /data/config.yaml 时写入 MCP 全局凭证。留空则启动时自动生成并打印到日志。
      # 只能包含字母、数字、点、下划线和连字符。已有配置文件时不会覆盖。
      CYBERSTRIKE_MCP_TOKEN: ${CYBERSTRIKE_MCP_TOKEN:-}
    volumes:
      - cyberstrike-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cyberstrike-data:
